<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f0d22">
<title>शब्द जोड़ो</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #e8e6f4; --bg-glow: #fff3d6; --fg: #1c1936; --muted: #5f5a7a; --panel: rgba(255,255,255,.6); --line: #cdc8e4;
  --tile: #f1effa; --tile-hi: #ffffff; --edge: #b4aed3; --shadow: rgba(46,34,110,.38);
  --sel-a: #ffd95e; --sel-b: #ffa928; --tile-sel-fg: #2b1c00; --edge-sel: #b66f08;
  --btn-border: #1c1936; --card: #f7f6fd; --hint: #e0541f;
  --lv0: #f6d860; --lv1: #9fcb6b; --lv2: #9cb9f0; --lv3: #c08ad6;
  --toast-bg: #1c1936; --toast-fg: #fff; --bar: #7f78a6;
  --font: "Mukta", "Noto Sans Devanagari", system-ui, sans-serif;
  --sh-rest: 0 1px 0 var(--edge), 0 2px 0 var(--edge), 0 3px 0 var(--edge), 0 4px 0 var(--edge), 0 5px 0 var(--edge), 0 6px 0 var(--edge), 0 14px 20px -6px var(--shadow);
  --sh-press: 0 1px 0 var(--edge), 0 2px 0 var(--edge), 0 5px 8px -3px var(--shadow);
  --sh-sel: 0 1px 0 var(--edge-sel), 0 2px 0 var(--edge-sel), 0 3px 0 var(--edge-sel), 0 4px 0 var(--edge-sel), 0 5px 0 var(--edge-sel), 0 6px 0 var(--edge-sel), 0 20px 28px -6px rgba(255,150,20,.55);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f0d22; --bg-glow: #2a2060; --fg: #efeefb; --muted: #a29fc4; --panel: rgba(36,31,84,.6); --line: #342f66;
    --tile: #2c2858; --tile-hi: #3b3675; --edge: #130f2c; --shadow: rgba(0,0,0,.7);
    --edge-sel: #9a5f08; --btn-border: #efeefb; --card: #1a1736; --hint: #ff8a57;
    --toast-bg: #efeefb; --toast-fg: #0f0d22; --bar: #6f68a3;
  }
}
:root[data-theme="dark"] {
  --bg: #0f0d22; --bg-glow: #2a2060; --fg: #efeefb; --muted: #a29fc4; --panel: rgba(36,31,84,.6); --line: #342f66;
  --tile: #2c2858; --tile-hi: #3b3675; --edge: #130f2c; --shadow: rgba(0,0,0,.7);
  --edge-sel: #9a5f08; --btn-border: #efeefb; --card: #1a1736; --hint: #ff8a57;
  --toast-bg: #efeefb; --toast-fg: #0f0d22; --bar: #6f68a3;
}
:root[lang="kn"] { --font: "Noto Sans Kannada", "Mukta", system-ui, sans-serif; }
:root[lang="te"] { --font: "Noto Sans Telugu", "Mukta", system-ui, sans-serif; }
:root[lang="ta"] { --font: "Noto Sans Tamil", "Mukta", system-ui, sans-serif; }
* { box-sizing: border-box; }
html { color-scheme: light dark; }
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh; color: var(--fg); font-family: var(--font);
  background: radial-gradient(120% 70% at 50% -10%, var(--bg-glow), transparent 60%), var(--bg);
  background-attachment: fixed;
  -webkit-tap-highlight-color: transparent;
}
#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; opacity: 0; transition: opacity 1.2s; }
#bg.on { opacity: 1; }
button, select { font-family: var(--font); }
:focus-visible { outline: 3px solid var(--hint); outline-offset: 2px; }
main {
  position: relative; z-index: 1; width: 100%; max-width: 560px; margin: 0 auto;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { font-size: clamp(1.1rem, 5vw, 1.8rem); margin: 0; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; letter-spacing: .01em; }
.icons { display: flex; gap: 2px; flex-shrink: 0; padding: 2px; border-radius: 999px; background: var(--panel); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.icon-btn {
  width: 38px; height: 40px; display: grid; place-items: center; border-radius: 50%;
  background: none; border: none; color: var(--fg); cursor: pointer; font-weight: 800; padding: 0; transition: background .15s, transform .15s;
}
.icon-btn:hover { background: var(--line); }
.icon-btn:active { transform: scale(.9); }
.icon-btn svg { width: 21px; height: 21px; }
.sub {
  color: var(--muted); margin: 12px 0 16px; display: flex; justify-content: space-between; gap: 8px;
  padding: 4px 12px; border-radius: 999px; background: var(--panel); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; padding-bottom: 8px; }
.board.loading { min-height: 240px; place-items: center; color: var(--muted); }
.tile {
  --rx: 0deg; --ry: 0deg; --z: 0px; --ty: 0px; --mx: 50%; --my: 20%;
  position: relative; aspect-ratio: 1.35; border: none; border-radius: 12px; cursor: pointer; padding: 4px;
  background: linear-gradient(165deg, var(--tile-hi), var(--tile)); color: var(--fg);
  font-weight: 700; font-size: clamp(0.95rem, 4.2vw, 1.25rem); line-height: 1.15; overflow-wrap: normal;
  box-shadow: var(--sh-rest);
  transform: perspective(520px) translateY(var(--ty)) translateZ(var(--z)) rotateX(var(--rx)) rotateY(var(--ry));
  transition: transform .16s ease-out, box-shadow .16s ease-out, background .2s;
  touch-action: manipulation;
}
.tile::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .2s;
  background: radial-gradient(circle at var(--mx) var(--my), rgba(255,255,255,.5), transparent 58%);
}
.tile.tilt::after { opacity: 1; }
.tile.long { font-size: clamp(0.8rem, 3.4vw, 1.05rem); }
.tile.xlong { font-size: clamp(0.7rem, 2.9vw, 0.92rem); }
.tile:active { --ty: 4px; --z: 0px; box-shadow: var(--sh-press); }
.tile.sel {
  --ty: -6px; --z: 28px; color: var(--tile-sel-fg);
  background: linear-gradient(165deg, var(--sel-a), var(--sel-b)); box-shadow: var(--sh-sel);
}
.tile.hint { outline: 3px solid var(--hint); outline-offset: -3px; }
.tile.pop { animation: flip .55s cubic-bezier(.3,.7,.3,1); }
@keyframes flip {
  0% { transform: perspective(520px) rotateY(0deg); }
  45% { transform: perspective(520px) translateY(-10px) translateZ(70px) rotateY(180deg) scale(1.08); }
  100% { transform: perspective(520px) translateY(var(--ty)) translateZ(var(--z)) rotateY(360deg); }
}
.tile.deal { animation: deal .6s cubic-bezier(.2,.8,.25,1) both; animation-delay: calc(var(--i) * 40ms); }
@keyframes deal {
  from { opacity: 0; transform: perspective(520px) translateY(30px) translateZ(-80px) rotateX(-75deg); }
  to { opacity: 1; transform: perspective(520px); }
}
.tile.hop { animation: hop .4s ease both; }
@keyframes hop {
  0%, 100% { transform: perspective(520px) translateY(var(--ty)) translateZ(var(--z)); }
  50% { transform: perspective(520px) translateY(-18px) translateZ(70px) rotateX(-12deg); }
}
.solved-row {
  grid-column: 1 / -1; border-radius: 12px; padding: 10px; text-align: center; color: #1f1b16;
  min-height: 72px; display: flex; flex-direction: column; justify-content: center; transform-origin: 50% 0;
  box-shadow: 0 4px 0 rgba(0,0,0,.2), 0 12px 20px -8px var(--shadow);
  background-image: linear-gradient(170deg, rgba(255,255,255,.35), transparent 60%);
}
.solved-row.fresh { animation: slide .55s cubic-bezier(.2,.8,.25,1); }
.solved-row strong { font-size: 1.1rem; }
@keyframes slide { from { transform: perspective(700px) rotateX(-80deg) scale(.96); opacity: 0; } to { transform: perspective(700px) rotateX(0) scale(1); opacity: 1; } }
.lv0 { background-color: var(--lv0); } .lv1 { background-color: var(--lv1); }
.lv2 { background-color: var(--lv2); } .lv3 { background-color: var(--lv3); }
.tile.shake { animation: shake .4s; }
@keyframes shake {
  0%, 100% { transform: perspective(520px) translateY(var(--ty)) translateZ(var(--z)) rotateY(0); }
  25% { transform: perspective(520px) translateY(var(--ty)) translateZ(var(--z)) translateX(-8px) rotateY(-14deg); }
  75% { transform: perspective(520px) translateY(var(--ty)) translateZ(var(--z)) translateX(8px) rotateY(14deg); }
}
.mistakes { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 18px 0; color: var(--muted); }
#dots { display: flex; gap: 6px; }
.dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, var(--sel-a), var(--sel-b)); box-shadow: 0 2px 0 var(--edge-sel); transition: background .3s, transform .3s, box-shadow .3s; }
.dot.used { background: var(--line); box-shadow: none; transform: scale(.7) translateY(2px); }
.controls { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.btn {
  border: 1px solid var(--btn-border); background: var(--panel); color: var(--fg); border-radius: 999px;
  min-height: 44px; padding: 9px 18px; font-weight: 600; font-size: 1rem; cursor: pointer;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  box-shadow: 0 3px 0 var(--btn-border); transition: transform .1s, box-shadow .1s;
}
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 0 0 var(--btn-border); }
.btn.primary { background: var(--fg); color: var(--bg); }
.btn:disabled { opacity: .4; cursor: default; box-shadow: none; }
.toast {
  position: fixed; top: max(18px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); background: var(--toast-bg); color: var(--toast-fg);
  padding: 8px 16px; border-radius: 10px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 30;
  max-width: calc(100% - 32px); text-align: center; box-shadow: 0 10px 24px -8px var(--shadow);
}
.toast.show { opacity: 1; }
.result { text-align: center; margin-top: 18px; }
.result h2 { margin: 0 0 4px; }
.grid-emoji { font-size: 1.4rem; line-height: 1.25; margin: 8px 0; white-space: pre; }
.muted { color: var(--muted); }
dialog {
  border: none; border-radius: 18px; background: var(--card); color: var(--fg);
  max-width: 440px; width: calc(100% - 32px); max-height: calc(100% - 48px); padding: 20px;
  box-shadow: 0 30px 60px -20px rgba(0,0,0,.6);
}
dialog[open] { animation: dlg .3s cubic-bezier(.2,.8,.25,1); }
@keyframes dlg { from { opacity: 0; transform: perspective(800px) translateY(20px) rotateX(-12deg); } to { opacity: 1; transform: none; } }
dialog::backdrop { background: rgba(10,8,30,.55); backdrop-filter: blur(4px); }
dialog h2 { margin-top: 0; }
dialog ul { padding-left: 20px; }
.dlg-head { display: flex; justify-content: space-between; align-items: center; }
.dlg-head h2 { margin: 0; }
.swatches { display: flex; gap: 6px; margin: 6px 0; }
.swatches span { flex: 1; padding: 4px; border-radius: 8px; text-align: center; color: #1f1b16; font-size: .85rem; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 14px 0; text-align: center; }
.stats b { display: block; font-size: 1.6rem; line-height: 1.1; }
.stats small { color: var(--muted); }
.dist { display: grid; grid-template-columns: auto 1fr; gap: 6px 8px; align-items: center; }
.dist .bar { background: var(--bar); color: #fff; border-radius: 6px; padding: 0 6px; min-width: 22px; text-align: right; font-weight: 600; }
.dist .bar.cur { background: #4f8a3a; }
.archive { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 6px; margin-top: 12px; }
.archive button {
  border: none; border-radius: 10px; background: var(--tile); color: var(--fg); padding: 8px 0 6px;
  font-weight: 600; font-size: .95rem; cursor: pointer; line-height: 1.1; box-shadow: 0 2px 0 var(--edge);
}
.archive button small { display: block; font-size: .8rem; }
.archive button.won { background: var(--lv1); color: #1f1b16; }
.archive button.lost { background: #e9a39b; color: #1f1b16; }
.archive button.today { outline: 2px solid var(--fg); }
.langs { display: grid; gap: 8px; margin-top: 12px; }
.langs button {
  display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--line); border-radius: 12px;
  background: var(--bg); color: var(--fg); padding: 12px 14px; font-size: 1.1rem; font-weight: 600; cursor: pointer;
}
.langs button small { color: var(--muted); font-weight: 400; font-family: "Mukta", sans-serif; }
.langs button.cur { border-color: var(--fg); border-width: 2px; }
.setting { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); gap: 12px; }
.setting select, .setting input { font: inherit; }
select { background: var(--bg); color: var(--fg); border: 1px solid var(--btn-border); border-radius: 8px; padding: 4px 8px; }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 20; }
.hidden { display: none !important; }

@media (min-width: 700px) {
  main { max-width: 640px; }
  .board { gap: 14px; }
  .tile { font-size: clamp(1.1rem, 2.4vw, 1.5rem); }
  .tile.long { font-size: clamp(0.95rem, 2vw, 1.25rem); }
  .tile.xlong { font-size: clamp(0.85rem, 1.7vw, 1.05rem); }
}
@media (min-width: 1100px) { main { max-width: 720px; } }
@media (max-height: 560px) and (orientation: landscape) {
  main { max-width: 760px; }
  .tile { aspect-ratio: 2.2; }
  .mistakes { margin: 10px 0; }
  .sub { margin: 6px 0 10px; }
}
@media (max-width: 360px) {
  .board { gap: 6px; }
  .icon-btn { width: 34px; }
  .btn { padding: 9px 12px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<main>
  <header>
    <h1 id="title">शब्द जोड़ो</h1>
    <div class="icons">
      <button class="icon-btn" id="langBtn" data-i18n-label="language">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h9M8.5 3v2M6 5c.5 3 2.5 5.5 5 7M11 5c-.5 3.5-3 6.5-6.5 8"/><path d="M12.5 21l4-10 4 10M14 17.5h5"/></svg>
      </button>
      <button class="icon-btn" id="helpBtn" data-i18n-label="howToPlay">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5V14"/><circle cx="12" cy="17.2" r=".6" fill="currentColor"/></svg>
      </button>
      <button class="icon-btn" id="archiveBtn" data-i18n-label="archive">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      </button>
      <button class="icon-btn" id="statsBtn" data-i18n-label="stats">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" data-i18n-label="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
    </div>
  </header>
  <p class="sub"><span id="sub"></span><span id="timer"></span></p>

  <div class="board" id="board" aria-live="polite"></div>

  <div class="mistakes" id="mistakesWrap">
    <span data-i18n="mistakesLeft"></span><span id="dots"></span>
  </div>

  <div class="controls" id="controls">
    <button class="btn" id="shuffleBtn" data-i18n="shuffle"></button>
    <button class="btn" id="hintBtn" data-i18n="hint"></button>
    <button class="btn" id="clearBtn" data-i18n="clear"></button>
    <button class="btn primary" id="submitBtn" data-i18n="submit" disabled></button>
  </div>

  <section class="result hidden" id="result">
    <h2 id="resultTitle"></h2>
    <div class="muted" id="resultMeta"></div>
    <div class="grid-emoji" id="emojiGrid"></div>
    <p class="muted" id="nextIn"></p>
    <div class="controls">
      <button class="btn primary" id="shareBtn" data-i18n="share"></button>
      <button class="btn" id="resultStatsBtn" data-i18n="stats"></button>
      <button class="btn" id="practiceBtn" data-i18n="practiceBtn"></button>
      <button class="btn hidden" id="todayBtn" data-i18n="todayBtn"></button>
    </div>
  </section>
</main>

<canvas id="confetti" class="hidden"></canvas>
<div class="toast" id="toast" role="status"></div>

<dialog id="help">
  <h2 data-i18n="howToPlay"></h2>
  <ul id="helpList"></ul>
  <p data-i18n="colorsMean"></p>
  <div class="swatches">
    <span class="lv0" data-i18n="lv0"></span><span class="lv1" data-i18n="lv1"></span>
    <span class="lv2" data-i18n="lv2"></span><span class="lv3" data-i18n="lv3"></span>
  </div>
  <form method="dialog" style="text-align:center;margin-top:12px"><button class="btn primary" data-i18n="play"></button></form>
</dialog>

<dialog id="langDlg">
  <div class="dlg-head"><h2 data-i18n="language"></h2><form method="dialog"><button class="icon-btn" aria-label="✕">✕</button></form></div>
  <div class="langs" id="langList"></div>
</dialog>

<dialog id="statsDlg">
  <div class="dlg-head"><h2 data-i18n="stats"></h2><form method="dialog"><button class="icon-btn" aria-label="✕">✕</button></form></div>
  <div class="stats" id="statsNums"></div>
  <h3 style="margin:8px 0" data-i18n="distTitle"></h3>
  <div class="dist" id="dist"></div>
</dialog>

<dialog id="archiveDlg">
  <div class="dlg-head"><h2 data-i18n="archive"></h2><form method="dialog"><button class="icon-btn" aria-label="✕">✕</button></form></div>
  <p class="muted" style="margin:6px 0 0" data-i18n="archiveNote"></p>
  <div class="archive" id="archiveGrid"></div>
</dialog>

<dialog id="settingsDlg">
  <div class="dlg-head"><h2 data-i18n="settings"></h2><form method="dialog"><button class="icon-btn" aria-label="✕">✕</button></form></div>
  <label class="setting"><span data-i18n="language"></span><select id="langSelect"></select></label>
  <label class="setting"><span data-i18n="sound"></span><input type="checkbox" id="soundToggle"></label>
  <label class="setting"><span data-i18n="theme"></span>
    <select id="themeSelect"><option value="system" data-i18n="themeSystem"></option><option value="light" data-i18n="themeLight"></option><option value="dark" data-i18n="themeDark"></option></select>
  </label>
  <div class="setting"><span data-i18n="resetLabel"></span><button class="btn" id="resetBtn" data-i18n="resetBtn"></button></div>
</dialog>

<script>
// ---- languages ----

  ta: { name: "தமிழ்", latin: "Tamil", htmlLang: "ta", font: "Noto+Sans+Tamil" },
};

const I18N = {
  hi: {

    mistakesLeft: "बची हुई गलतियाँ:", shuffle: "मिलाएँ", hint: "संकेत", clear: "हटाएँ", submit: "जमा करें",
    won: "आपने पहेली सुलझा ली!", lost: "इस बार नहीं हो पाया", time: "समय", mistakes: "गलतियाँ", hintUsed: "💡 संकेत लिया",

    resetLabel: "இந்த மொழியின் முன்னேற்றத்தை அழி", resetBtn: "அழி", resetConfirm: "இந்த மொழியின் எல்லா முன்னேற்றமும் புள்ளிவிவரமும் அழிக்கவா?", resetDone: "முன்னேற்றம் அழிக்கப்பட்டது",
    loadFailed: "புதிர்களை ஏற்ற முடியவில்லை",
  },
};

const MAX_MISTAKES = 4;
const EPOCH = new Date(2026, 0, 1); // day 0 = puzzle #1 in every language
const EMOJI = ["🟨", "🟩", "🟦", "🟪"];
const STORE = "shabd-jodo:";

const $ = (id) => document.getElementById(id);
const loadRaw = (k, d) => { try { const v = localStorage.getItem(STORE + k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const saveRaw = (k, v) => { try { localStorage.setItem(STORE + k, JSON.stringify(v)); } catch {} };
// Games, results and stats are kept per language; settings are shared.
const load = (k, d) => loadRaw(lang + ":" + k, d);
const save = (k, v) => saveRaw(lang + ":" + k, v);
const mod = (a, n) => ((a % n) + n) % n;
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const graphemes = window.Intl && Intl.Segmenter ? new Intl.Segmenter(undefined, { granularity: "grapheme" }) : null;
const glyphCount = (w) => graphemes ? [...graphemes.segment(w)].length : w.length;

// Same rule as the original: days since a fixed local-midnight epoch, wrapped over the puzzle list.
function dayNumber(d = new Date()) {
  const midnight = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  return Math.round((midnight - EPOCH) / 864e5);
}
function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function fmtTime(ms) {
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

// Players from before languages existed kept Hindi data without a language prefix.
(function migrateLegacy() {
  try {
    if (localStorage.getItem(STORE + "migrated")) return;
    for (const k of Object.keys(localStorage)) {
      const rest = k.slice(STORE.length);
      if (k.startsWith(STORE) && /^(game-\d+|result-\d+|stats)$/.test(rest)) {
        localStorage.setItem(STORE + "hi:" + rest, localStorage.getItem(k));
        localStorage.removeItem(k);
      }
    }
    localStorage.setItem(STORE + "migrated", "1");
  } catch {}
})();

const settings = { sound: false, theme: "system", ...loadRaw("settings", {}) };
function initialLang() {
  const fromUrl = new URLSearchParams(location.search).get("lang");
  if (fromUrl && LANGS[fromUrl]) return fromUrl;
  if (settings.lang && LANGS[settings.lang]) return settings.lang;
  for (const l of navigator.languages || []) {
    const code = l.toLowerCase().split("-")[0];
    if (["kn", "te", "ta", "hi"].includes(code)) return code;
  }
  return "hi";
}

let lang = initialLang();
let t = I18N[lang];
let PUZZLES = null;
let state = null;   // see newState()
let selected = [];
let busy = false;   // true while a solve animation plays
let freshLevel = null;
let dealNext = true; // next render() deals the tiles in with a flip
let backdropTheme = () => {}; // replaced once the Three.js backdrop starts

const loaded = {};
function loadPuzzles(code) {
  if (window.PUZZLES_BY_LANG && window.PUZZLES_BY_LANG[code]) return Promise.resolve(window.PUZZLES_BY_LANG[code]);
  if (!loaded[code]) loaded[code] = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = `puzzles/${code}.js`;
    s.onload = () => (window.PUZZLES_BY_LANG && window.PUZZLES_BY_LANG[code]) ? resolve(window.PUZZLES_BY_LANG[code]) : reject();
    s.onerror = () => { delete loaded[code]; reject(); };
    document.head.appendChild(s);
  });
  return loaded[code];
}
function loadFont(code) {
  const f = LANGS[code].font;
  if (!f || document.getElementById("font-" + code)) return;
  const link = document.createElement("link");
  link.id = "font-" + code;
  link.rel = "stylesheet";
  link.href = `https://fonts.googleapis.com/css2?family=${f}:wght@400;600;800&display=swap`;
  document.head.appendChild(link);
}

function applyI18n() {
  document.documentElement.lang = LANGS[lang].htmlLang;
  document.title = t.title;
  $("title").textContent = t.title;
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t[el.dataset.i18n]; });
  document.querySelectorAll("[data-i18n-label]").forEach((el) => {
    el.setAttribute("aria-label", t[el.dataset.i18nLabel]);
    el.title = t[el.dataset.i18nLabel];
  });
  $("helpList").innerHTML = t.help.map((line) => `<li>${line}</li>`).join("");
  fitTitle();
}

// Shrinks the title until it fits beside the header icons (Tamil/Telugu titles are wider than Hindi).
function fitTitle() {
  const h = $("title");
  h.style.fontSize = "";
  let size = parseFloat(getComputedStyle(h).fontSize);
  while (h.scrollWidth > h.clientWidth + 1 && size > 12) { size -= 1; h.style.fontSize = size + "px"; }
}
// Shrinks a tile's text until its longest word fits on one line, so words never break mid-letter.
function fitTiles() {
  document.querySelectorAll(".tile").forEach((el) => {
    el.style.fontSize = "";
    el.style.overflowWrap = "";
    let size = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > el.clientWidth + 1 && size > 11.5) { size -= 0.5; el.style.fontSize = size + "px"; }
    // Still too wide at the smallest readable size: allow a break between letters.
    if (el.scrollWidth > el.clientWidth + 1) el.style.overflowWrap = "anywhere";
  });
}
addEventListener("resize", () => { fitTitle(); fitTiles(); });
document.fonts && document.fonts.ready.then(fitTitle);

async function setLang(code, { remember = true } = {}) {
  lang = code;
  t = I18N[lang];
  if (remember) { settings.lang = code; saveRaw("settings", settings); }
  const url = new URL(location.href);
  url.searchParams.set("lang", code);
  history.replaceState(null, "", url);
  loadFont(code);
  applyI18n();
  $("langSelect").value = code;
  state = null;
  $("board").className = "board loading";
  $("board").textContent = t.loading;
  for (const id of ["controls", "mistakesWrap", "result"]) $(id).classList.add("hidden");
  $("sub").textContent = "";
  try {
    PUZZLES = await loadPuzzles(code);
  } catch {
    $("board").textContent = t.loadFailed;
    return;
  }
  if (code !== lang) return; // switched again while loading
  $("board").className = "board";
  startDaily();
}

const puzzleFor = (day) => mod(day, PUZZLES.length);
function groupsOf(idx) { return PUZZLES[idx].groups.map(([name, words], level) => ({ name, words, level })); }

function newState(mode, day, puzzleIdx) {
  return { mode, day, puzzleIdx, count: PUZZLES.length, order: shuffled(groupsOf(puzzleIdx).flatMap((g) => g.words)),
           solved: [], mistakes: 0, guesses: [], seen: [], done: false, won: false,
           hintWord: null, elapsed: 0, started: false };
}

// Daily and archive games are saved per day; practice games are throwaway.
function openDay(day) {
  const mode = day === dayNumber() ? "daily" : "archive";
  const saved = load("game-" + day, null);
  state = saved && saved.count === PUZZLES.length ? saved : newState(mode, day, puzzleFor(day));
  state.mode = mode;
  selected = [];
  dealNext = true;
  render();
}
const startDaily = () => openDay(dayNumber());

function startPractice() {
  let idx;
  do { idx = Math.floor(Math.random() * PUZZLES.length); } while (PUZZLES.length > 1 && idx === state.puzzleIdx);
  state = newState("practice", null, idx);
  selected = [];
  dealNext = true;
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function persist() { if (state && state.mode !== "practice") save("game-" + state.day, state); }

function subtitle() {
  if (state.mode === "daily") return t.today + (state.day + 1);
  if (state.mode === "archive") return t.old + (state.day + 1);
  return t.practice;
}

function tileSizeClass(w) {
  const n = LANGS[lang].htmlLang === "hi-Latn" ? w.length * 0.7 : glyphCount(w);
  return n > 9 ? " xlong" : n > 6 ? " long" : "";
}

function render() {
  if (!state) return;
  const board = $("board");
  board.innerHTML = "";
  const groups = groupsOf(state.puzzleIdx);
  // On a loss, reveal the remaining groups in difficulty order.
  const shown = state.done ? [...state.solved, ...groups.map((g) => g.level).filter((l) => !state.solved.includes(l))] : state.solved;
  for (const lvl of shown) {
    const g = groups[lvl];
    const row = document.createElement("div");
    row.className = "solved-row lv" + lvl + (lvl === freshLevel ? " fresh" : "");
    row.innerHTML = `<strong></strong><span></span>`;
    row.querySelector("strong").textContent = g.name;
    row.querySelector("span").textContent = g.words.join(", ");
    board.appendChild(row);
  }
  freshLevel = null;
  const solvedWords = new Set(shown.flatMap((l) => groups[l].words));
  const dealing = dealNext && !reducedMotion;
  dealNext = false;
  let tileIdx = 0;
  for (const w of state.order.filter((w) => !solvedWords.has(w))) {
    const b = document.createElement("button");
    b.className = "tile" + (selected.includes(w) ? " sel" : "") + (w === state.hintWord ? " hint" : "") + tileSizeClass(w) + (dealing ? " deal" : "");
    if (dealing) b.style.setProperty("--i", tileIdx++);
    b.textContent = w;
    b.dataset.word = w;
    b.setAttribute("aria-pressed", selected.includes(w));
    b.onclick = () => toggle(w);
    board.appendChild(b);
  }
  fitTiles();
  $("sub").textContent = subtitle();
  $("dots").innerHTML = Array.from({ length: MAX_MISTAKES }, (_, i) =>
    `<span class="dot${i < state.mistakes ? " used" : ""}"></span>`).join("");
  $("submitBtn").disabled = selected.length !== 4 || busy;
  $("clearBtn").disabled = selected.length === 0;
  $("hintBtn").disabled = !!state.hintWord;
  for (const id of ["controls", "mistakesWrap"]) $(id).classList.toggle("hidden", state.done);
  $("result").classList.toggle("hidden", !state.done);
  renderTimer();
  if (state.done) renderResult();
}

function toggle(w) {
  if (state.done || busy) return;
  state.started = true;
  let added = false;
  if (selected.includes(w)) selected = selected.filter((x) => x !== w);
  else if (selected.length < 4) { selected.push(w); added = true; sound("tap"); }
  // Update tiles in place (no rebuild) so the flip and lift transitions can play.
  document.querySelectorAll(".tile").forEach((el) => {
    const on = selected.includes(el.dataset.word);
    el.classList.toggle("sel", on);
    el.setAttribute("aria-pressed", on);
  });
  const el = added && tileOf(w);
  if (el && !reducedMotion) { el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }
  $("submitBtn").disabled = selected.length !== 4 || busy;
  $("clearBtn").disabled = selected.length === 0;
}

// ---- pointer tilt: tiles lean toward the cursor / finger and catch a moving glare ----
(function tilt() {
  if (reducedMotion) return;
  const board = $("board");
  const reset = (el) => { ["--rx", "--ry", "--z"].forEach((p) => el.style.removeProperty(p)); el.classList.remove("tilt"); };
  const lean = (e) => {
    const el = e.target.closest && e.target.closest(".tile");
    if (!el || el.classList.contains("pop") || el.classList.contains("shake")) return;
    const r = el.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
    el.style.setProperty("--ry", ((px - .5) * 22).toFixed(1) + "deg");
    el.style.setProperty("--rx", (-(py - .5) * 22).toFixed(1) + "deg");
    el.style.setProperty("--mx", (px * 100).toFixed(0) + "%");
    el.style.setProperty("--my", (py * 100).toFixed(0) + "%");
    if (!el.classList.contains("sel") && e.pointerType !== "touch") el.style.setProperty("--z", "14px");
    el.classList.add("tilt");
  };
  board.addEventListener("pointermove", lean);
  board.addEventListener("pointerdown", lean);
  const leave = (e) => { const el = e.target.closest && e.target.closest(".tile"); if (el) reset(el); };
  board.addEventListener("pointerout", leave);
  board.addEventListener("pointerup", leave);
  board.addEventListener("pointercancel", leave);
})();

function levelOf(w) { return groupsOf(state.puzzleIdx).find((g) => g.words.includes(w)).level; }
const tileOf = (w) => document.querySelector(`.tile[data-word="${CSS.escape(w)}"]`);

async function submit() {
  if (selected.length !== 4 || busy) return;
  const seenKey = selected.slice().sort().join("|");
  if (state.seen.includes(seenKey)) { toast(t.already); return; }
  state.seen.push(seenKey);
  const levels = selected.map(levelOf);
  state.guesses.push(levels);
  const counts = {};
  for (const l of levels) counts[l] = (counts[l] || 0) + 1;
  const best = Math.max(...Object.values(counts));

  if (best === 4) {
    busy = true;
    render();
    if (!reducedMotion) {
      selected.map(tileOf).forEach((el, i) => { el.style.animationDelay = i * 90 + "ms"; el.classList.add("hop"); });
      await wait(650);
    }
    sound("correct");
    state.solved.push(levels[0]);
    freshLevel = levels[0];
    selected = [];
    busy = false;
    if (state.solved.length === 4) { finish(true); return; }
  } else {
    state.mistakes++;
    sound("wrong");
    if (navigator.vibrate) navigator.vibrate(120);
    toast(best === 3 ? t.oneAway : t.wrong);
    selected.map(tileOf).forEach((el) => { el.classList.remove("pop"); el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); });
    if (state.mistakes >= MAX_MISTAKES) {
      selected = [];
      persist();
      setTimeout(() => finish(false), 650);
      return;
    }
    persist();
    // Update the mistake dots only, so the tiles keep their shake animation.
    $("dots").innerHTML = Array.from({ length: MAX_MISTAKES }, (_, i) =>
      `<span class="dot${i < state.mistakes ? " used" : ""}"></span>`).join("");
    return;
  }
  persist();
  render();
}

function useHint() {
  if (state.done || state.hintWord) return;
  const easiest = groupsOf(state.puzzleIdx).find((g) => !state.solved.includes(g.level));
  state.hintWord = easiest.words[Math.floor(Math.random() * 4)];
  state.started = true;
  toast(t.hintToast);
  persist();
  render();
}

function finish(won) {
  state.done = true;
  state.won = won;
  if (state.mode !== "practice") {
    if (!load("result-" + state.day, null)) {
      save("result-" + state.day, { won, mistakes: state.mistakes, time: state.elapsed });
      const s = getStats();
      s.played++;
      if (won) { s.wins++; s.dist[state.mistakes]++; } else s.dist[4]++;
      if (state.mode === "daily") {
        if (won) {
          s.streak = s.lastWinDay === state.day - 1 ? s.streak + 1 : 1;
          s.lastWinDay = state.day;
          s.maxStreak = Math.max(s.maxStreak, s.streak);
        } else s.streak = 0;
      }
      save("stats", s);
    }
  }
  persist();
  render();
  if (won) {
    sound("win");
    confetti();
    toast(state.mistakes === 0 ? t.perfect : t.great);
  } else toast(t.nextTime);
}

function getStats() {
  const s = load("stats", {});
  return { played: 0, wins: 0, streak: 0, maxStreak: 0, lastWinDay: null, ...s, dist: s.dist || [0, 0, 0, 0, 0] };
}

function emojiGrid() { return state.guesses.map((g) => g.map((l) => EMOJI[l]).join("")).join("\n"); }

function renderResult() {
  $("resultTitle").textContent = state.won ? t.won : t.lost;
  $("resultMeta").textContent = `${t.time} ${fmtTime(state.elapsed)} · ${t.mistakes} ${state.mistakes}` + (state.hintWord ? " · " + t.hintUsed : "");
  $("emojiGrid").textContent = emojiGrid();
  $("todayBtn").classList.toggle("hidden", state.mode === "daily");
  updateCountdown();
}

function renderTimer() {
  $("timer").textContent = state && (state.started || state.done) ? "⏱ " + fmtTime(state.elapsed) : "";
}

function updateCountdown() {
  if (!state) return;
  if (state.mode === "daily" && state.day !== dayNumber() && state.done) { startDaily(); return; }
  if (!state.done) return;
  if (state.mode !== "daily") { $("nextIn").textContent = ""; return; }
  const now = new Date();
  const ms = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1) - now;
  const pad = (n) => String(n).padStart(2, "0");
  $("nextIn").textContent = `${t.nextIn} ${pad(Math.floor(ms / 36e5))}:${pad(Math.floor((ms % 36e5) / 6e4))}:${pad(Math.floor((ms % 6e4) / 1e3))}`;
}

// The timer runs only while the game is in progress and the tab is visible.
let lastTick = Date.now();
setInterval(() => {
  const now = Date.now();
  if (state && state.started && !state.done && !document.hidden) {
    state.elapsed += now - lastTick;
    renderTimer();
    if (Math.floor(state.elapsed / 1000) % 5 === 0) persist();
  }
  lastTick = now;
  updateCountdown();
}, 1000);
document.addEventListener("visibilitychange", () => { lastTick = Date.now(); if (document.hidden) persist(); });

async function share() {
  const label = state.mode === "practice" ? t.practiceBtn : `#${state.day + 1}`;
  const text = `${t.title} (${LANGS[lang].name}) ${label}${state.hintWord ? " 💡" : ""}\n⏱ ${fmtTime(state.elapsed)}\n${emojiGrid()}`;
  try {
    if (navigator.share) await navigator.share({ text });
    else { await navigator.clipboard.writeText(text); toast(t.copied); }
  } catch {}
}

// ---- dialogs ----
function openStats() {
  const s = getStats();
  const pct = s.played ? Math.round((s.wins / s.played) * 100) : 0;
  $("statsNums").innerHTML = [[t.played, s.played], [t.winPct, pct], [t.streak, s.streak], [t.maxStreak, s.maxStreak]]
    .map(([k, v]) => `<div><b>${v}</b><small>${k}</small></div>`).join("");
  const max = Math.max(1, ...s.dist);
  const cur = state && state.done && state.mode !== "practice" ? (state.won ? state.mistakes : 4) : -1;
  $("dist").innerHTML = s.dist.map((n, i) =>
    `<span>${i === 4 ? t.lostShort : i}</span><div class="bar${i === cur ? " cur" : ""}" style="width:${Math.max(8, (n / max) * 100)}%">${n}</div>`).join("");
  $("statsDlg").showModal();
}

function openArchive() {
  if (!PUZZLES) return;
  const today = dayNumber();
  const grid = $("archiveGrid");
  grid.innerHTML = "";
  for (let d = today; d >= 0; d--) {
    const r = load("result-" + d, null);
    const b = document.createElement("button");
    b.className = (r ? (r.won ? "won" : "lost") : "") + (d === today ? " today" : "");
    b.innerHTML = `${d + 1}<small>${r ? (r.won ? "✓" : "✗") : d === today ? t.todayShort : "&nbsp;"}</small>`;
    b.setAttribute("aria-label", `#${d + 1}`);
    b.onclick = () => { $("archiveDlg").close(); openDay(d); window.scrollTo({ top: 0 }); };
    grid.appendChild(b);
  }
  $("archiveDlg").showModal();
}

function openLangs() {
  const list = $("langList");
  list.innerHTML = "";
  for (const [code, info] of Object.entries(LANGS)) {
    const b = document.createElement("button");
    b.className = code === lang ? "cur" : "";
    b.innerHTML = `<span></span><small></small>`;
    b.querySelector("span").textContent = info.name;
    b.querySelector("small").textContent = info.latin;
    b.onclick = () => { $("langDlg").close(); if (code !== lang) setLang(code); };
    list.appendChild(b);
  }
  $("langDlg").showModal();
}

function applyTheme(th) {
  if (th === "system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.dataset.theme = th;
  backdropTheme();
}
applyTheme(settings.theme);
$("langSelect").innerHTML = Object.entries(LANGS).map(([c, i]) => `<option value="${c}">${i.name}</option>`).join("");
$("soundToggle").checked = settings.sound;
$("themeSelect").value = settings.theme;
$("langSelect").onchange = (e) => { $("settingsDlg").close(); setLang(e.target.value); };
$("soundToggle").onchange = (e) => { settings.sound = e.target.checked; saveRaw("settings", settings); sound("tap"); };
$("themeSelect").onchange = (e) => { settings.theme = e.target.value; saveRaw("settings", settings); applyTheme(settings.theme); };
$("resetBtn").onclick = () => {
  if (!confirm(t.resetConfirm)) return;
  try { Object.keys(localStorage).filter((k) => k.startsWith(STORE + lang + ":")).forEach((k) => localStorage.removeItem(k)); } catch {}
  $("settingsDlg").close();
  if (PUZZLES) startDaily();
  toast(t.resetDone);
};

// ---- sound (Web Audio, off by default) ----
let audioCtx;
function sound(kind) {
  if (!settings.sound) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = { tap: [[660, 0, .05]], wrong: [[220, 0, .18], [180, .12, .2]],
                    correct: [[523, 0, .12], [659, .1, .12], [784, .2, .18]],
                    win: [[523, 0, .15], [659, .12, .15], [784, .24, .15], [1047, .36, .3]] }[kind];
    for (const [freq, at, dur] of notes) {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = kind === "wrong" ? "sawtooth" : "triangle";
      o.frequency.value = freq;
      const start = audioCtx.currentTime + at;
      g.gain.setValueAtTime(0.0001, start);
      g.gain.exponentialRampToValueAtTime(kind === "wrong" ? 0.06 : 0.12, start + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
      o.connect(g).connect(audioCtx.destination);
      o.start(start); o.stop(start + dur + 0.02);
    }
  } catch {}
}

// ---- 3D backdrop (Three.js, loaded lazily; the CSS gradient is the fallback) ----
const isDark = () => document.documentElement.dataset.theme === "dark" ||
  (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
function startBackdrop() {
  const canvas = $("bg");
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, powerPreference: "low-power" }); } catch { return; }
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
  camera.position.z = 18;
  scene.add(new THREE.AmbientLight(0xffffff, 0.75));
  const key = new THREE.DirectionalLight(0xffffff, 1.2);
  key.position.set(-5, 7, 10);
  scene.add(key);

  // Floating slabs in the four group colours, like loose tiles drifting behind the board.
  const colors = [0xf6d860, 0x9fcb6b, 0x9cb9f0, 0xc08ad6];
  const geo = new THREE.BoxGeometry(2.2, 1.6, 0.4);
  const mats = colors.map((c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.4, metalness: 0.08, transparent: true }));
  const slabs = [];
  const count = innerWidth * innerHeight > 700000 ? 36 : 24;
  for (let i = 0; i < count; i++) {
    const m = new THREE.Mesh(geo, mats[i % 4]);
    const s = 0.5 + Math.random() * 1.1;
    m.scale.set(s, s, s);
    m.userData = {
      x: (Math.random() - 0.5) * 2, y: (Math.random() - 0.5) * 2, z: -16 + Math.random() * 15,
      rx: Math.random() * 6, ry: Math.random() * 6, vx: (Math.random() - 0.5) * 0.25, vy: (Math.random() - 0.5) * 0.25,
      ph: Math.random() * 6.28, sp: 0.15 + Math.random() * 0.3,
    };
    scene.add(m);
    slabs.push(m);
  }
  backdropTheme = () => mats.forEach((m) => { m.opacity = isDark() ? 0.6 : 0.42; });
  backdropTheme();

  let w = 0, h = 0;
  function resize() {
    w = innerWidth; h = innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  resize();
  const px = { x: 0, y: 0, tx: 0, ty: 0 };
  addEventListener("pointermove", (e) => { px.tx = e.clientX / innerWidth - 0.5; px.ty = e.clientY / innerHeight - 0.5; });
  const vh = (z) => 2 * Math.tan(Math.PI / 8) * (camera.position.z - z);

  function frame(time) {
    const t = time / 1000;
    px.x += (px.tx - px.x) * 0.04; px.y += (px.ty - px.y) * 0.04;
    camera.position.x = px.x * 3; camera.position.y = -px.y * 2;
    camera.lookAt(0, 0, 0);
    for (const m of slabs) {
      const d = m.userData, H = vh(d.z), W = H * camera.aspect;
      m.position.set(d.x * W * 0.55 + Math.sin(t * d.sp + d.ph) * 0.6, d.y * H * 0.55 + Math.cos(t * d.sp + d.ph) * 0.6, d.z);
      m.rotation.set(d.rx + t * d.vx, d.ry + t * d.vy, 0);
    }
    renderer.render(scene, camera);
  }
  let raf = 0;
  const loop = (time) => { frame(time); raf = requestAnimationFrame(loop); };
  const run = () => { cancelAnimationFrame(raf); if (!reducedMotion && !document.hidden) raf = requestAnimationFrame(loop); else frame(performance.now()); };
  addEventListener("resize", () => { resize(); if (reducedMotion) frame(0); });
  document.addEventListener("visibilitychange", run);
  run();
  canvas.classList.add("on");
}
function loadBackdrop() {
  if (navigator.connection && navigator.connection.saveData) return;
  const s = document.createElement("script");
  s.src = "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js";
  s.async = true;
  s.onload = () => { try { startBackdrop(); } catch {} };
  document.head.appendChild(s);
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => backdropTheme());

// ---- confetti ----
function confetti() {
  if (reducedMotion) return;
  const c = $("confetti"), ctx = c.getContext("2d");
  c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio;
  ctx.scale(devicePixelRatio, devicePixelRatio);
  c.classList.remove("hidden");
  const colors = ["#f6d860", "#9fcb6b", "#9cb9f0", "#c08ad6", "#e07a1f"];
  const parts = Array.from({ length: 120 }, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * 80, y: innerHeight * .35,
    vx: (Math.random() - .5) * 9, vy: -Math.random() * 9 - 3, r: Math.random() * 6 + 4,
    rot: Math.random() * 6, vr: (Math.random() - .5) * .3, color: colors[Math.floor(Math.random() * colors.length)],
  }));
  const end = performance.now() + 2200;
  (function frame(now) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of parts) {
      p.vy += .25; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore();
    }
    if (now < end) requestAnimationFrame(frame);
    else { ctx.setTransform(1, 0, 0, 1, 0, 0); c.classList.add("hidden"); }
  })(performance.now());
}

let toastTimer;
function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
}

$("shuffleBtn").onclick = () => { state.order = shuffled(state.order); persist(); render(); };
$("clearBtn").onclick = () => { selected = []; render(); };
$("submitBtn").onclick = submit;
$("hintBtn").onclick = useHint;
$("shareBtn").onclick = share;
$("practiceBtn").onclick = startPractice;
$("todayBtn").onclick = startDaily;
$("langBtn").onclick = openLangs;
$("helpBtn").onclick = () => $("help").showModal();
$("statsBtn").onclick = openStats;
$("resultStatsBtn").onclick = openStats;
$("archiveBtn").onclick = openArchive;
$("settingsBtn").onclick = () => $("settingsDlg").showModal();

setLang(lang, { remember: false });
loadBackdrop();
if (!loadRaw("seenHelp", false)) { $("help").showModal(); saveRaw("seenHelp", true); }
